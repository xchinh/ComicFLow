services:
  postgres:
    image: postgres:16
    container_name: comic-postgres
    restart: always
    environment:
      POSTGRES_DB: comic_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - comic-data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: comic-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - comic-redis:/data
    command: redis-server --appendonly yes

  comic-minio:
    image: minio/minio
    container_name: comic-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - comic-minio-data:/data
volumes:
  comic-data:
  comic-redis:
  comic-minio-data: